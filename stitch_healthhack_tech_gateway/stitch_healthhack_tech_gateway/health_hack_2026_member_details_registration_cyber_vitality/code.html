<!DOCTYPE html><html class="dark" lang="th" style=""><head>

<style>
        body {
            background-color: #071617;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glass-panel {
            background: rgba(22, 28, 33, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow:focus-within {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            border-color: #00f0ff;
        }
        .neon-text-glow {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body class="text-on-background font-body-md antialiased min-h-screen flex flex-col">
<!-- TopNavBar: Standard Transactional Suppression -->
<!-- Suppressed navigation shell due to transactional intent (Registration Form) -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12 relative z-10">
<div class="w-full max-w-3xl glass-panel rounded-xl p-8 md:p-12">
<!-- Header & Step Indicator -->
<div class="mb-10 text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter mb-4 uppercase">Registration</h1>
<div class="flex items-center justify-center gap-4 mt-6">
<div class="flex items-center gap-2">
<div class="w-8 h-1 bg-outline-white"></div>

</div>
<div class="flex items-center gap-2">
<div class="w-8 h-1 bg-outline-white"></div>

</div>
<div class="flex items-center gap-2">
<div class="w-8 h-1 bg-outline-white"></div>

</div>
</div>
</div>
<form action="#" class="space-y-10" method="POST">
<!-- Section 1: Team Information -->
<fieldset class="space-y-6">
<legend class="font-headline-md text-headline-md text-primary border-b border-outline-white pb-2 w-full mb-6 uppercase tracking-wider">
                        ส่วนที่ 1: ข้อมูลทั่วไปของทีม
                    </legend>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="teamName">Team Name (ชื่อทีม)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="teamName" name="teamName" placeholder="Enter team name" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Team Type (ประเภททีม)</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<label class="flex items-center gap-3 p-3 border border-outline-white rounded cursor-pointer hover:bg-surface-container-high transition-colors">
<input class="form-radio text-neon-cyan bg-surface-container border-outline-white focus:ring-neon-cyan" name="teamType" type="radio" value="pharmacy">
<span class="font-body-md text-body-md">ทีมที่มีนิสิตเภสัชศาสตร์</span>
</label>
<label class="flex items-center gap-3 p-3 border border-outline-white rounded cursor-pointer hover:bg-surface-container-high transition-colors">
<input class="form-radio text-neon-cyan bg-surface-container border-outline-white focus:ring-neon-cyan" name="teamType" type="radio" value="non-pharmacy">
<span class="font-body-md text-body-md">ทีมที่ไม่มีนิสิตเภสัชศาสตร์</span>
</label>
</div>
</div>
</div>
</fieldset>
<!-- Section 2: Member Details -->
<fieldset class="space-y-6">
<div class="flex items-center justify-between border-b border-outline-white pb-2 mb-6">
<legend class="font-headline-md text-headline-md text-primary uppercase tracking-wider">
                            ส่วนที่ 2: ข้อมูลสมาชิก
                        </legend>
<span class="font-label-caps text-label-caps text-neon-cyan bg-neon-cyan/10 px-3 py-1 rounded-full border border-neon-cyan/30"><span class="material-symbols-outlined text-xl" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_drop_down</span></span>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="title">Title (คำนำหน้า)</label>
<select class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all appearance-none" id="title" name="title">
<option disabled="" selected="" value="">Select Title</option>
<option value="mr">นาย</option>
<option value="ms">นางสาว</option>
<option value="mrs">นาง</option>
</select>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name (ชื่อจริง นามสกุล)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="fullName" name="fullName" placeholder="Enter full name" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="nickname">Nickname (ชื่อเล่น)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="nickname" name="nickname" placeholder="Enter nickname" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="age">Age (อายุ)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="age" max="99" min="15" name="age" placeholder="Enter age" type="number">
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="institution">Faculty/Institute/School (คณะและสถาบัน/โรงเรียน)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="institution" name="institution" placeholder="Enter faculty or institution" type="text">
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="allergies">Food/Drug Allergies (แพ้อาหาร/ยา)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="allergies" name="allergies" placeholder="Enter any allergies (or 'None')" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="email" name="email" placeholder="Enter email address" type="email">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="lineId">Line ID</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="lineId" name="lineId" placeholder="Enter Line ID" type="text">
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="phone">Phone Number (เบอร์โทร)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="phone" name="phone" placeholder="Enter phone number" type="tel">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="emergencyName">Emergency Contact Name (ชื่อผู้ติดต่อฉุกเฉิน)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="emergencyName" name="emergencyName" placeholder="Enter contact name" type="text">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="emergencyPhone">Emergency Contact Phone (เบอร์โทรผู้ติดต่อฉุกเฉิน)</label>
<input class="w-full bg-surface-container border border-outline-white rounded p-3 font-data-mono text-data-mono text-primary focus:outline-none neon-glow transition-all" id="emergencyPhone" name="emergencyPhone" placeholder="Enter contact phone" type="tel">
</div>
</div>
</fieldset>
<!-- Actions -->
<div class="flex flex-col md:flex-row justify-between items-center gap-6 pt-8 border-t border-outline-white">
<button class="w-full md:w-auto flex items-center justify-center gap-2 font-data-mono text-data-mono text-primary border border-outline-white bg-transparent px-6 py-3 rounded hover:bg-surface-container-high transition-colors uppercase tracking-widest group" type="button">
<span class="material-symbols-outlined text-xl group-hover:text-neon-cyan transition-colors" style="font-variation-settings: &quot;FILL&quot; 0;">person_add</span>
                        Add Member (เพิ่มสมาชิก)
                    </button>
<button class="w-full md:w-auto font-label-caps text-label-caps text-background bg-primary px-8 py-3 rounded uppercase tracking-widest hover:bg-slate-200 active:scale-95 transition-all shadow-[0_0_15px_rgba(255,255,255,0.3)] hover:shadow-[0_0_25px_rgba(0,240,255,0.5)]" type="submit">
                        Next Step (ขั้นตอนต่อไป)
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer: Standard Transactional Suppression -->
<!-- Suppressed footer to maintain focus on the form -->






</body></html>
